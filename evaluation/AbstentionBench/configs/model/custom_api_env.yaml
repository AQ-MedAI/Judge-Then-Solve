# @package _global_
# 自定义 OpenAI 兼容 API 模型配置（支持从环境变量读取）
# 类似 generate_responses.py 的配置方式
# 环境变量：
#   - SGLANG_BASE_URL 或 CUSTOM_API_BASE_URL: API base URL（例如 "http://127.0.0.1:40000/v1"）
#   - SGLANG_API_KEY 或 CUSTOM_API_KEY: API key
#
# 使用方式：
# 1. 设置环境变量后运行：
#    export SGLANG_BASE_URL="http://127.0.0.1:40000/v1"
#    export SGLANG_API_KEY="EMPTY"
#    python main.py -m mode=local model=custom_api_env dataset=gsm8k module.model_name="your-model-name"
#
# 2. 或者在命令行中直接指定：
#    python main.py -m mode=local model=custom_api_env dataset=gsm8k \
#      module.model_name="your-model-name" \
#      module.base_url="http://127.0.0.1:40000/v1" \
#      module.api_key="your-key"

module:
  _target_: recipe.models.CustomOpenAIModel
  model_name: ${model_name_env:your-model-name}  # 从命令行传入，例如：module.model_name="Qwen3-30B-A3B-Thinking-2507"
  # base_url 和 api_key 可以从环境变量读取（SGLANG_BASE_URL/CUSTOM_API_BASE_URL 和 SGLANG_API_KEY/CUSTOM_API_KEY）
  # 也可以在这里直接指定，或通过命令行传入：
  # base_url: "http://127.0.0.1:40000/v1"
  # api_key: "EMPTY"
  # 99.9% of responses are below 4k tokens;
  # this avoids infinite generation loops in model responses
  max_tokens: 32000
  temperature: 0.8
  seed: ${seed}

# 使用 module.model_name 作为 model_name，这样结果目录会使用实际的模型名称
model_name: ${module.model_name}
