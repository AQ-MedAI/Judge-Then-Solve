# @package _global_
# 使用 GPT-4o API 作为 Judge 模型（通过自定义 base_url 和 api_key）
# 使用 OpenAI-compatible API 服务
#
# 使用方式：
# 1. 直接使用此配置（已预设 base_url、api_key 和 model_name）：
#    python main.py -m ... abstention_detector=llm_judge_gpt4o_custom_api
#
# 2. 通过命令行覆盖参数：
#    python main.py -m ... abstention_detector=llm_judge_gpt4o_custom_api \
#      abstention_detector.judge_model.base_url="your-base-url" \
#      abstention_detector.judge_model.api_key="your-api-key" \
#      abstention_detector.judge_model.model_name="gpt-4o-2024-11-20"

judge_name: LLMJudgeGPT4oCustomAPI

abstention_detector:
  _target_: recipe.evaluation.LLMJudgeAbstentionDetector
  judge_model:
    _target_: recipe.models.GPT4oAPI
    # 使用自定义 API（类似 test2.py 的配置方式）
    base_url: ${oc.env:JUDGE_BASE_URL,${oc.env:OPENAI_BASE_URL,https://api.openai.com/v1}}
    api_key: ${oc.env:JUDGE_API_KEY,${oc.env:OPENAI_API_KEY}}
    model_name: "gpt-4o-2024-11-20"  # GPT-4o 模型版本
    # Setting temp. to 0 means we are generating output as
    # arg max {P(yes | context), P(no | context)} in the judge.
    # This also follows the judge setup in prior works like
    # CoCoNot and HarmBench.
    max_tokens: 100
    temperature: 0.
  save_dir: ${save_dir}

abstention_detector_launcher:
  gpus_per_node: 0  # API 不需要 GPU
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 8
  timeout_min: 400
  mem_gb: 16  # API 不需要太多内存
